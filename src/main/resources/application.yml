spring:
  application:
    name: commerce

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/commerce
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: true
    open-in-view: false

jwt:
  secret: commerce-secret-key-for-jwt-authentication-must-be-at-least-256-bits
  access-token-expiration: 1800000    # 30분
  refresh-token-expiration: 604800000 # 7일

logging:
  level:
    com.hjhan.commerce: DEBUG
    org.hibernate.SQL: DEBUG
