spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/commerce_test?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: false
    open-in-view: false

jwt:
  secret: commerce-secret-key-for-jwt-authentication-must-be-at-least-256-bits
  access-token-expiration: 1800000
  refresh-token-expiration: 604800000

logging:
  level:
    com.hjhan.commerce: WARN
    org.hibernate.SQL: WARN
